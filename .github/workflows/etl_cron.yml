name: Scheduled YouTube Polars ETL

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars tzdata google-cloud-bigquery google-api-python-client google-genai python-dotenv

      - name: Decode GCP Service Account Key
        env:
          GCP_KEY_BASE64: ${{ secrets.GCP_KEY_JSON }}
        run: |
          echo "$GCP_KEY_BASE64" | base64 --decode > gcp-key.json

      - name: Execute Polars ETL Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          GOOGLE_APPLICATION_CREDENTIALS: ./gcp-key.json
        run: |
          python etl_pipeline.py

      - name: Clean up GCP Key
        if: always()
        run: |
          rm -f gcp-key.json